# ${VAR:padrao} le da variavel de ambiente; senhas so vem do .env
arquivos:
  catalogo: dados/brutos/catalogo.csv
  interacoes: dados/brutos/interacoes.json
  comentarios: dados/brutos/comentarios.json

saida:
  processados: dados/processados
  resumo: dados/processados/resumo_ingestao.json
  log: logs/execucao.log

postgres:
  host: ${POSTGRES_HOST:postgres}
  port: ${POSTGRES_PORT:5432}
  database: ${POSTGRES_DB:desafio}
  user: ${POSTGRES_USER:desafio}
  password: ${POSTGRES_PASSWORD}

mongodb:
  host: ${MONGO_HOST:mongo}
  port: ${MONGO_PORT:27017}
  database: desafio
  user: ${MONGO_USER}
  password: ${MONGO_PASSWORD}
  colecao_comentarios: comentarios

embeddings:
  modelo: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  dimensao: 384
  lote: 64

busca:
  top_k: 5
  demonstracao:
    - "Quero aprender os fundamentos de banco de dados para inteligência artificial."
    - "Como proteger dados pessoais e atender à LGPD?"
    - "Curso prático de deploy de aplicações na nuvem com containers"

recomendacao:
  top_k: 10
  nota_minima_aprovacao: 4

# ---------------------------------------------------------------
# Desafio 2 — parametros nao sensiveis (segredos so no .env)
# O Hop tem o proprio arquivo de ambiente: hop/environments/docker.json
# ---------------------------------------------------------------

fontes_desafio2:
  usuarios: dados/brutos/usuarios.csv
  lote_2: dados/brutos/lote_2
  falhas: dados/brutos/falhas        # arquivos defeituosos para demonstrar falha de arquivo (RF23)

camadas:
  schemas: [bronze, silver, gold, quarentena, qualidade, controle, restrito]
  diretorios:
    bronze: dados/bronze             # amostras exportadas (RF34)
    silver: dados/silver             # exportacao Parquet (RF24)
    gold: dados/gold                 # amostras exportadas (RF34)
    quarentena: dados/quarentena     # amostras exportadas (RF34)

parquet:                             # RF24: beam/exportar_silver.py
  destino: dados/silver              # interacao/ particionado + conteudo e usuario_correspondencia
  comparacao: dados/silver/comparacao  # mesmo recorte em CSV e JSON
  volume: dados/volume               # experimento de escala (nao versionado)
  particao: mes                      # AAAA-MM, derivado de data_hora
  mes_consulta: "2026-08"            # consulta seletiva do experimento
  repeticoes: 7

beam:
  runners:
    direct:
      - --runner=DirectRunner
    spark:                           # requer: docker compose --profile beam up -d
      - --runner=PortableRunner
      - --job_endpoint=beam-job-server:8099
      - --artifact_endpoint=beam-job-server:8098
      - --environment_type=EXTERNAL
      - --environment_config=localhost:50000   # worker pool divide a rede com o spark-worker
